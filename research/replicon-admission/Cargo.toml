[package]
name = "rill-replicate-replicon-admission"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["bevy_state"] }
bevy_replicon = { version = "=0.45.2", default-features = false, features = ["client", "server"] }
serde = { version = "1", features = ["derive"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
debug = 0
incremental = false
